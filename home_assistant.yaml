# The script POSTs the desired state on every change and as a heartbeat:
#   {"detected": true|false, "confidence": 0.53}
# Home Assistant must SET the state from that payload, never toggle it, so a
# repeated message is harmless. Use ONE of the options below in configuration.yaml.

# Option A (simplest): a template binary sensor driven by the webhook - no helper needed.
template:
  - triggers:
      - trigger: webhook
        webhook_id: baby-detect-change-me
        allowed_methods: [POST]
        local_only: true
    binary_sensor:
      - name: Baby Detected
        unique_id: baby_detected
        device_class: occupancy
        state: "{{ trigger.json.detected }}"
        attributes:
          confidence: "{{ trigger.json.confidence }}"

